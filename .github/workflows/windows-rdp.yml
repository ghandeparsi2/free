
name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "M@hb0d#123456789" -AsPlainText -Force
          New-LocalUser -Name "meAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "meAdmin" -ErrorAction SilentlyContinue
          net user runneradmin M@hb0d#123456789

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          # Download and install Tailscale silently
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          # Connect to Tailscale network
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          
          Start-Sleep -Seconds 8
          
          # Get Tailscale IP
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : meAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : M@hb0d#123456789" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green
      
      - name: 4. Update Cloudflare DNS with Tailscale IP
          $ErrorActionPreference = "Stop"
          $recordName = "tailscale.soda-sharj.ir"
          $ts_ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4 |
              Select-Object -First 1).Trim()

          $headers = @{
              Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN"
              "Content-Type" = "application/json"
          }

          $zoneId = $env:CLOUDFLARE_ZONE_ID
          $baseUrl = "https://api.cloudflare.com/client/v4"

          # Find existing DNS record
          $url = "$baseUrl/zones/$zoneId/dns_records?type=A&name=$recordName"
          $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get

          if (-not $response.success) {
              throw "Cloudflare DNS lookup failed"
          }

          $body = @{
              type    = "A"
              name    = $recordName
              content = $ts_ip
              ttl     = 60
              proxied = $false
              } | ConvertTo-Json

          if ($response.result.Count -gt 0) {
              $recordId = $response.result[0].id
              $url = "$baseUrl/zones/$zoneId/dns_records/$recordId"

              $result = Invoke-RestMethod -Uri $url -Headers $headers `
                  -Method Patch -Body $body
          } else {
              $url = "$baseUrl/zones/$zoneId/dns_records"

              $result = Invoke-RestMethod -Uri $url -Headers $headers `
                  -Method Post -Body $body
          }

          if (-not $result.success) {
              throw "Cloudflare DNS update failed"
          }

          Write-Host "Cloudflare DNS updated successfully:"
          Write-Host "$recordName -> $ts_ip"
      - name: 5. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }
